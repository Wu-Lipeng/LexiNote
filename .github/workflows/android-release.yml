name: Build and Release Android App

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Android signing key
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build signed release APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#android-v}"
          APK="android-app/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then echo "Release APK was not created." >&2; exit 1; fi
          ARGS=("$TAG" "$APK#lexinote-${VERSION}.apk" "--title" "LexiNote Android ${VERSION}" "--generate-notes")
          if [[ "$VERSION" == *-* ]]; then ARGS+=("--prerelease"); fi
          gh release create "${ARGS[@]}"

      - name: Publish update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${TAG#android-v}"
          cat > android-update.json <<EOF
          {"version":"${VERSION}","apkUrl":"https://github.com/${REPOSITORY}/releases/download/${TAG}/lexinote-${VERSION}.apk"}
          EOF
          if gh release view android-update >/dev/null 2>&1; then
            gh release upload android-update android-update.json --clobber
          else
            gh release create android-update android-update.json --title "LexiNote Android update manifest" --notes "Machine-readable Android update manifest." --latest=false
          fi
