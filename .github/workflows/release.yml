name: Build and Release Zotero Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build XPI
        shell: pwsh
        run: ./build.ps1

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $xpi = Get-ChildItem -LiteralPath "dist" -Filter "*.xpi" | Select-Object -First 1
          if (-not $xpi) { throw "Build did not produce an XPI file." }
          gh release create $tag $xpi.FullName --title "LexiNote $tag" --generate-notes
